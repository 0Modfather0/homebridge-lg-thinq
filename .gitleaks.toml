[extend]
useDefault = true

[allowlist]
description = "Public legacy LG client constants inherited from the upstream plugin"
condition = "AND"
paths = ['''src/lib/constants\.ts''']
regexTarget = "line"
regexes = [
  '''(?:OAUTH_SECRET_KEY|API_KEY|API_CLIENT_ID|APPLICATION_KEY)\s*=''',
  '''BEGIN PUBLIC KEY''',
  '''^\s*'[A-Za-z0-9+/=]{32,}',?$''',
]
